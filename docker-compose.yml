# Any server (VPS, AWS EC2, Azure VM, Google Compute Engine, on-premise): app + Caddy
# (automatic HTTPS for every client domain) + daily backups + housekeeping.
#
#   cp .env.example .env              # set PLATFORM_ADMIN_HOST (console address) and CRON_SECRET
#   docker compose up -d --build
#   docker compose exec app npm run console:admin -- --email=you@example.com --password='a-long-password'
#   (or open https://<PLATFORM_ADMIN_HOST>/console — the first visit creates the console login)
#
# Then add clients in the console. Point each client domain (and the console host) at this
# server's IP; Caddy fetches certificates automatically.
#
# Data lives in the `clinic-data` volume:
#   /data/platform.db                 clients, addresses, console logins
#   /data/tenants/<id>/site.db        each client's own database
#   /data/tenants/<id>/uploads/…      each client's uploaded files
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      PLATFORM_ADMIN_HOST: ${PLATFORM_ADMIN_HOST:?Set PLATFORM_ADMIN_HOST in .env}
      # Behind Caddy: real protocol, host and client IP come from proxy headers.
      PROTOCOL_HEADER: x-forwarded-proto
      ADDRESS_HEADER: X-Forwarded-For
      XFF_DEPTH: '1'
    volumes:
      - clinic-data:/data
    expose:
      - '3000'

  caddy:
    image: caddy:2.8
    restart: unless-stopped
    depends_on: [app]
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  backup:
    image: alpine:3.20
    restart: unless-stopped
    depends_on: [app]
    environment:
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_HOUR: ${BACKUP_HOUR:-2}
      TZ: ${TZ:-Asia/Kolkata}
    volumes:
      - clinic-data:/data:ro
      - ./backups:/backups
      - ./deploy/backup.sh:/backup.sh:ro
    entrypoint: ['/bin/sh', '/backup.sh', 'loop']

  # Housekeeping for every client every 10 minutes (webhook retries, cleanup). Needs CRON_SECRET.
  cron:
    image: alpine:3.20
    restart: unless-stopped
    depends_on: [app]
    environment:
      CRON_SECRET: ${CRON_SECRET:-}
      CONSOLE_HOST: ${PLATFORM_ADMIN_HOST:-}
    entrypoint:
      - /bin/sh
      - -c
      - 'apk add --no-cache curl >/dev/null; while true; do [ -n "$$CRON_SECRET" ] && curl -fsS -X POST -H "Host: $$CONSOLE_HOST" -H "X-Forwarded-Proto: https" -H "Authorization: Bearer $$CRON_SECRET" http://app:3000/console/cron >/dev/null; sleep 600; done'

volumes:
  clinic-data:
  caddy-data:
  caddy-config:
