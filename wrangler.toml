# Cloudflare Workers (static assets) configuration.
# Build with:  npm run build:cf     Deploy with:  npm run deploy:cf
name = "clinic-site"
main = ".svelte-kit/cloudflare/_worker.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_als"]

[assets]
binding = "ASSETS"
directory = ".svelte-kit/cloudflare"

[observability]
enabled = true

# D1 database. Create it with:  npx wrangler d1 create clinic-db
# then paste the database_id below.
[[d1_databases]]
binding = "DB"
database_name = "clinic-db"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "drizzle"

# No R2 needed: uploaded images and PDFs are stored in D1 (table media_chunks)
# and served from /media with edge caching.

# Cron trigger for webhook retries. The worker forwards it to /api/internal/cron.
# (Optional; deliveries are also retried opportunistically on admin requests.)
# [triggers]
# crons = ["*/10 * * * *"]

[vars]
EMAIL_PROVIDER = "none"
# Secrets: set with `npx wrangler secret put NAME`
#   RESEND_API_KEY, TURNSTILE_SECRET_KEY, CRON_SECRET, SETUP_TOKEN
