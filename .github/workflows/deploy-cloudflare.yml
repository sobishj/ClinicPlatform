# Deploys to Cloudflare Workers on every push to main.
# Repository secrets: CLOUDFLARE_API_TOKEN (Workers + D1 edit), CLOUDFLARE_ACCOUNT_ID.
# (Alternatively connect the repo in the Cloudflare dashboard — see README "Deploy to Cloudflare".)
name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Opt-in: set the repository variable DEPLOY_TO_CLOUDFLARE=true once secrets and wrangler.toml are ready.
    if: ${{ vars.DEPLOY_TO_CLOUDFLARE == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:unit -- --run
      - run: npm run build:cf
      # No migration step: the Worker creates/upgrades the platform and client databases itself on first use.
      - name: Deploy worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
